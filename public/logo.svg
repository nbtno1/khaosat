<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Circular background with subtle gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- National Shield Emblem -->
  <path d="M60 22 L86 34 V58 C86 76 60 92 60 92 C60 92 34 76 34 58 V34 Z" fill="#b91c1c" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Inner Gold Star -->
  <polygon points="60,35 64,47 76,47 66,54 70,66 60,59 50,66 54,54 44,47 56,47" fill="url(#goldGrad)"/>

  <!-- Balance scales / Auditor symbols -->
  <path d="M48 76 L72 76 M60 70 L60 82 M54 82 L66 82" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Text Arc or Banner -->
  <rect x="25" y="94" width="70" height="16" rx="8" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="60" y="105" text-anchor="middle" font-size="8" font-weight="900" font-family="system-ui, -apple-system, sans-serif" fill="#ffffff" letter-spacing="1">KTNN</text>
</svg>